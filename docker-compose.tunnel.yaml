
name: registry
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry-ui
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: registry-ui
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      # Registry UI configuration
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: ${REGISTRY_TITLE:-Docker Registry}
      DELETE_IMAGES: ${DELETE_IMAGES:-false}
      SHOW_CONTENT_DIGEST: "true"
      SHOW_CATALOG_NB_TAGS: "true"
      CATALOG_MIN_BRANCHES: "1"
      CATALOG_MAX_BRANCHES: "1"
      TAGLIST_PAGE_SIZE: "100"
      CATALOG_ELEMENTS_LIMIT: "999999"
      REGISTRY_SECURED: "false"
      # The UI proxies registry API calls to the registry service
      NGINX_PROXY_PASS_URL: http://registry-server:5000
    depends_on:
      - server
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://registry-ui:80'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - registry
      - cloudflare

  server:
    image: registry:latest
    container_name: registry-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: registry-server
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: registry-server
      # Registry server configuration
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_CATALOG_MAXENTRIES: "999999"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: '[*]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Credentials: '[true]'
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: '[Docker-Content-Digest]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: '[HEAD,GET,OPTIONS,DELETE]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: '[Authorization,Accept,Cache-Control]'
    volumes:
      - './volumes/data/registry:/var/lib/registry:z'
    networks:
      - registry

networks:
  registry:
    name: registry
    external: false
  cloudflare:
    external: true
